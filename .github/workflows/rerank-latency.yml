name: rerank-latency

# Latency bench for local cross-encoder rerankers on a small CPU host.
# One job per (model, implementation); each runs 2, 4 and 1 cores on the same
# runner, one process per configuration inside a cpuset cgroup, then a final
# job merges the results.

on:
  pull_request:
    paths:
      - .github/workflows/rerank-latency.yml
      - scripts/rerank-latency/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rerank-latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (${{ matrix.short }}, ${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        short: [minilm-l6, minilm-l12, bge-base]
        # panel: the 20-candidate, 1,024-character row for every implementation
        # of the model on one runner, so implementations compare on one CPU.
        variant: [shipped, direct-fp32, direct-q8, panel]
        include:
          - { short: minilm-l6, model: cross-encoder/ms-marco-MiniLM-L-6-v2 }
          - { short: minilm-l12, model: cross-encoder/ms-marco-MiniLM-L-12-v2 }
          - { short: bge-base, model: BAAI/bge-reranker-base }
    env:
      JOB: ${{ matrix.short }}-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@v4

      - name: Scratch folder
        run: echo "WORK=$RUNNER_TEMP/bench" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install packages in a scratch folder
        run: |
          set -euo pipefail
          mkdir -p "$WORK"
          cp scripts/rerank-latency/measure.mjs "$WORK/"
          cd "$WORK"
          npm init -y > /dev/null
          npm view @framers/agentos@latest version optionalDependencies
          RANGE=$(npm view @framers/agentos@latest optionalDependencies --json | jq -r '.["@huggingface/transformers"]')
          echo "transformers range from @framers/agentos optionalDependencies: $RANGE"
          npm install --no-audit --no-fund @framers/agentos@latest "@huggingface/transformers@$RANGE"
          npm ls onnxruntime-node @huggingface/transformers @framers/agentos --all || true

      - name: Host and versions
        run: |
          set -euo pipefail
          cd "$WORK"
          {
            echo "## Host ($JOB)"
            echo '```'
            lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|Socket|L2|L3|Flags" | cut -c1-200
            echo "nproc: $(nproc)"
            for c in /sys/devices/system/cpu/cpu[0-9]*; do echo "$(basename $c) siblings $(cat $c/topology/thread_siblings_list)"; done
            free -m
            echo "cgroup: $(cat /proc/self/cgroup); root controllers: $(cat /sys/fs/cgroup/cgroup.controllers)"
            echo "agentos: $(node -p "require('./node_modules/@framers/agentos/package.json').version")"
            echo "transformers: $(node -p "require('./node_modules/@huggingface/transformers/package.json').version")"
            echo "onnxruntime-node: $(npm ls onnxruntime-node --all --parseable --long 2>/dev/null | sed 's/.*onnxruntime-node@//' | sort -u | tr '\n' ' ')"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          lscpu; nproc; free -m

      - name: Published source excerpts
        run: |
          set -uo pipefail
          cd "$WORK"
          F=node_modules/@framers/agentos/dist/cognition/rag/reranking/providers/LocalCrossEncoderReranker.js
          echo "== $F"; grep -n "quantized\|\[SEP\]\|text-classification\|for (const pair of batch)\|await this.pipeline\|positiveResult\|batchSize" "$F" || true
          T=node_modules/@huggingface/transformers/src/pipelines.js
          echo "== $T"; grep -n "class TextClassificationPipeline\|softmax(batch.data)\|multi_label_classification" "$T" | head -6 || true
          M=node_modules/@huggingface/transformers/src/models.js
          echo "== $M"; grep -n "dtype not specified\|model_file_name ?? 'model'" "$M" | head -6 || true

      - name: CPU-limit cgroups
        run: |
          set -euo pipefail
          # taskset alone does not hold: the ONNX runtime pins its own worker
          # threads. A cpuset cgroup bounds every thread of the process.
          echo "+cpuset" | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          for c in 1 2 4; do
            sudo mkdir -p /sys/fs/cgroup/bench-c$c
            echo "0-$((c-1))" | sudo tee /sys/fs/cgroup/bench-c$c/cpuset.cpus
            echo "bench-c$c effective: $(cat /sys/fs/cgroup/bench-c$c/cpuset.cpus.effective)"
          done

      - name: Measure
        env:
          MODEL: ${{ matrix.model }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          set -uo pipefail
          cd "$WORK"
          mkdir -p "$WORK/out"
          OUT="$WORK/out/results-$JOB.jsonl"
          : > "$OUT"
          NODE=$(command -v node)
          # run <cores> <seconds> <args...>: one node process inside the cpuset
          # cgroup for <cores>, also under taskset to the same CPUs.
          run() {
            local c=$1 tl=$2; shift 2
            echo "::group::cores $c: $*"
            timeout "$tl" bash -c 'sudo sh -c "echo $$ > /sys/fs/cgroup/bench-c$0/cgroup.procs" && exec taskset -c "0-$(($0-1))" "$@"' \
              "$c" "$NODE" measure.mjs --out "$OUT" --model "$MODEL" --cores "$c" --job "$JOB" --cache "$WORK/hf" "$@"
            local rc=$?
            LAST_RC=$rc
            if [ $rc -ne 0 ]; then
              printf '{"type":"process-exit","job":"%s","model":"%s","cores":%s,"args":"%s","rc":%s}\n' "$JOB" "$MODEL" "$c" "$*" "$rc" >> "$OUT"
            fi
            echo "::endgroup::"
          }
          cold() {
            run 4 600 --mode load --variant "$1" --phase cold
            if [ "$LAST_RC" -ne 0 ]; then run 4 600 --mode load --variant "$1" --phase cold; fi
          }
          if [ "$VARIANT" = panel ]; then
            for v in shipped direct-fp32 direct-q8; do cold "$v"; done
            for c in 2 4 1; do
              for v in shipped direct-fp32 direct-q8; do run "$c" 400 --mode bench --variant "$v" --shapes key --tag panel; done
            done
          else
            cold "$VARIANT"
            if [ "$VARIANT" = shipped ]; then cold direct-fp32; fi
            for c in 2 4 1; do
              run "$c" 300 --mode load --variant "$VARIANT" --phase cache
              run "$c" 720 --mode bench --variant "$VARIANT"
              if [ "$VARIANT" = shipped ]; then run "$c" 300 --mode bench --variant direct-fp32 --shapes key --tag ref; fi
            done
          fi
          node measure.mjs --mode summarize --dir "$WORK/out" --json "$WORK/results.json" --md "$WORK/summary.md"
          cat "$WORK/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-latency-${{ env.JOB }}
          path: |
            ${{ runner.temp }}/bench/out/results-*.jsonl
            ${{ runner.temp }}/bench/results.json
          if-no-files-found: warn

  merge:
    needs: measure
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: rerank-latency-*
          path: parts
      - name: Merge
        run: |
          set -euo pipefail
          node scripts/rerank-latency/measure.mjs --mode summarize --dir parts --json results.json --md summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: rerank-latency-results
          path: |
            results.json
            summary.md
