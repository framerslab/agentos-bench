name: CI

# A pull request that is ready runs the type check, the suite, the build and the built CLI.
# A draft and a push to master run the type check alone: the pull request that merged ran the
# suite on the same tree.
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  workflow_dispatch: {}

# A newer push to a pull request cancels the run it replaces; every other run keys its own group.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Measure checksums on the runner before pinning the test cache.
      - name: Inspect pinned BEAM files
        env:
          BEAM_SOURCE: https://raw.githubusercontent.com/vectorize-io/agent-memory-benchmark/28b644bd4dd653c0207c7507280439390c829155/data/beam/100k
        run: |
          mkdir -p "$RUNNER_TEMP/beam"
          cd "$RUNNER_TEMP/beam"
          for file in queries.json.gz documents.json.gz; do
            curl --fail --location --retry 3 --output "$file" "$BEAM_SOURCE/$file"
          done
          test "$(wc -c < queries.json.gz)" -eq 56681
          test "$(wc -c < documents.json.gz)" -eq 2745433
          test "$(git hash-object queries.json.gz)" = 7683115864c02f0592f791a01a3ae22a8a353ae0
          test "$(git hash-object documents.json.gz)" = ec209e394cc282300c46702810f9dd8793e9ae83
          sha256sum queries.json.gz documents.json.gz
      # Only the legacy token-retention fixture is read from the LFS run archive.
      # Hash the checked-out pointer before restoring its hydrated contents.
      - name: Restore the LFS test fixture
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: results/runs/2026-04-23T04-14-40-609--longmemeval-s--gpt-4o--full-cognitive--ingest.json
          key: lfs-test-fixture-${{ runner.os }}-${{ hashFiles('results/runs/2026-04-23T04-14-40-609--longmemeval-s--gpt-4o--full-cognitive--ingest.json') }}
      - name: Fetch only the LFS test fixture
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        run: git lfs pull --include "results/runs/2026-04-23T04-14-40-609--longmemeval-s--gpt-4o--full-cognitive--ingest.json" --exclude ""
      - name: Verify the LFS test fixture
        env:
          FIXTURE: results/runs/2026-04-23T04-14-40-609--longmemeval-s--gpt-4o--full-cognitive--ingest.json
        run: |
          pointer=$(git show "HEAD:$FIXTURE")
          oid=$(printf '%s\n' "$pointer" | sed -n 's/^oid sha256://p')
          size=$(printf '%s\n' "$pointer" | sed -n 's/^size //p')
          printf '%s  %s\n' "$oid" "$FIXTURE" | sha256sum --check
          test "$(wc -c < "$FIXTURE")" -eq "$size"
          echo "LFS test fixture: $size bytes"
      # Save before the suite so an unrelated test failure does not repeat a download.
      - name: Save the LFS test fixture
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: results/runs/2026-04-23T04-14-40-609--longmemeval-s--gpt-4o--full-cognitive--ingest.json
          key: ${{ steps.lfs-cache.outputs.cache-primary-key }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      # The suite runs even when the type check is red, so one run names both kinds of failure.
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build
      - name: The built CLI lists its benchmarks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node dist/cli.js list

  quick:
    name: Quick checks
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
