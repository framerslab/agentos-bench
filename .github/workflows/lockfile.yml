name: Lockfile

# Resolves the dependency ranges in package.json and offers pnpm-lock.yaml as an artifact, for a
# branch whose package.json changed. Installs never run on a developer's machine: download the
# artifact and commit it to the branch.
#
#   gh run download <run-id> -R framerslab/agentos-bench -n pnpm-lock
#   gh workflow run lockfile.yml -R framerslab/agentos-bench --ref <branch>

on:
  workflow_dispatch: {}
  pull_request:
    branches: [master]
    paths: [package.json]

concurrency:
  group: lockfile-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Resolve
        run: pnpm install --lockfile-only
      - name: Upload the lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
